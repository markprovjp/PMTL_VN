server {
    listen 443 ssl http2;
    server_name strapi.phapmontamlinh-quantheambotat.vn;

    ssl_certificate /etc/letsencrypt/live/strapi.phapmontamlinh-quantheambotat.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strapi.phapmontamlinh-quantheambotat.vn/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=30s;

    client_max_body_size 200m;

    # Strapi returns 404 on /admin/ but works on /admin
    location = /admin/ { return 301 /admin; }

    location / {
        proxy_pass http://backend:1337;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # OAuth callback can return large Set-Cookie headers.
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Ssl on;
    }
}
