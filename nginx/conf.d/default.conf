server {
    listen 80;
    server_name phapmontamlinh-quantheambotat.vn www.phapmontamlinh-quantheambotat.vn;

    resolver 127.0.0.11 valid=30s;

    # Prevent browsers from caching HTTPS-only behavior until TLS is configured on this VPS.
    proxy_hide_header Strict-Transport-Security;

    # Let's Encrypt HTTP-01 challenge (certbot webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
