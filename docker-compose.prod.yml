services:
  postgres:
    image: postgres:16-alpine
    container_name: pmtl-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pmtl-network

  backend:
    build: ./BE_PMTL
    container_name: pmtl-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "1337:1337"
    volumes:
      - ./BE_PMTL/public/uploads:/app/public/uploads
    networks:
      - pmtl-network

  frontend:
    build:
      context: ./fe-pmtl
    container_name: pmtl-frontend
    restart: always
    depends_on:
      backend:
        condition: service_started
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "3000:3000"
    networks:
      - pmtl-network

  nginx:
    image: nginx:alpine
    container_name: pmtl-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - pmtl-network

volumes:
  postgres_data:
networks:
  pmtl-network:
    driver: bridge
