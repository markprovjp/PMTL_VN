version: '3.8'

# 🔧 OPTIMIZED FOR 2GB RAM VPS
# Remove Meilisearch or use cloud instead
# Add memory limits to all containers (NOTE: `deploy.resources` is ignored in non-swarm compose)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pmtl-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_in_production}
    # 2GB tuning: keep Postgres conservative (initdb args can't set shared_buffers/max_connections)
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_buffers=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # For production, avoid exposing Postgres publicly. Use SSH tunnel if needed.
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    mem_reservation: 256m
    shm_size: 128m
    networks:
      - pmtl-network

  # Backend - Strapi (OPTIMIZED)
  backend:
    build:
      context: ./BE_PMTL
      dockerfile: Dockerfile.2gb
    container_name: pmtl-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: --max-old-space-size=384
      STRAPI_TELEMETRY_DISABLED: "true"
      STRAPI_DISABLE_UPDATE_NOTIFIER: "true"
      HOST: 0.0.0.0
      PORT: ${BACKEND_PORT:-1337}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change_me_in_production}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      APP_KEYS: ${APP_KEYS:-default_key_change_this}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-default_salt_change_this}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-default_secret_change_this}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_change_this}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-default_transfer}
      # Optional: Meilisearch Cloud instead of local
      # MEILISEARCH_HOST: https://your-meilisearch.cloud
      # MEILISEARCH_API_KEY: your-api-key
    ports:
      # In production, only Nginx needs to be public
      - "127.0.0.1:${BACKEND_PORT:-1337}:1337"
    volumes:
      - ./BE_PMTL/public/uploads:/app/public/uploads
      - ./BE_PMTL/.tmp:/app/.tmp
    networks:
      - pmtl-network
    mem_limit: 512m
    mem_reservation: 384m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1337/admin"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Frontend - Next.js (OPTIMIZED)
  frontend:
    build:
      context: ./fe-pmtl
      dockerfile: Dockerfile.2gb
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:1337}
    container_name: pmtl-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: --max-old-space-size=256
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:1337}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      # In production, only Nginx needs to be public
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - pmtl-network
    mem_limit: 384m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Nginx Reverse Proxy (OPTIMIZED)
  nginx:
    image: nginx:alpine
    container_name: pmtl-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - pmtl-network
    mem_limit: 96m
    mem_reservation: 64m

  # ⭕ MEILISEARCH - OPTIONAL
  # Option 1: Disable locally, use Meilisearch Cloud instead
  # Option 2: Uncomment below if you have extra 1GB RAM
  # meilisearch:
  #   image: getmeili/meilisearch:v1.11
  #   container_name: pmtl-meilisearch
  #   restart: always
  #   environment:
  #     MEILI_ENV: production
  #     MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-master_key}
  #   volumes:
  #     - meilisearch_data:/meili_data
  #   ports:
  #     - "7700:7700"
  #   networks:
  #     - pmtl-network
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 768M
  #       reservations:
  #         memory: 700M

volumes:
  postgres_data:
    driver: local
  # meilisearch_data:
  #   driver: local

networks:
  pmtl-network:
    driver: bridge

# Total Memory for this config:
# ─────────────────────────────
# Postgres: 256MB
# Backend:  384MB
# Frontend: 256MB
# Nginx:    64MB
# ─────────────────────────────
# TOTAL:    960MB + 200MB system = ~1.16GB
# SAFE FOR: 2GB VPS with headroom! ✅
