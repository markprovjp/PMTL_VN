name: 🚀 Build and Push PMTL-VN

on:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: 📦 Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./BE_PMTL
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pmtl-be:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./fe-pmtl
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pmtl-fe:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://pmtl.vn/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
