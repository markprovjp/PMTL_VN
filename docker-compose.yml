version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pmtl-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pmtl-network

  redis:
    image: redis:7-alpine
    container_name: pmtl-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - pmtl-network

  # Backend - Strapi
  backend:
    build:
      context: ./BE_PMTL
      dockerfile: Dockerfile
    container_name: pmtl-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: ${BACKEND_PORT:-1337}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change_me_in_production}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      APP_KEYS: ${APP_KEYS:-default_key_change_this}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-default_salt_change_this}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-default_secret_change_this}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_change_this}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-default_transfer}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULLMQ_ENABLED: ${BULLMQ_ENABLED:-true}
      FRONTEND_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      PUSH_WORKER_SECRET: ${PUSH_WORKER_SECRET:-dev_push_secret}
    ports:
      - "${BACKEND_PORT:-1337}:1337"
    volumes:
      - ./BE_PMTL/public/uploads:/app/public/uploads
      - ./BE_PMTL/.tmp:/app/.tmp
    networks:
      - pmtl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1337/admin"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Frontend - Next.js
  frontend:
    build:
      context: ./fe-pmtl
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:1337}
    container_name: pmtl-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:1337}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - pmtl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pmtl-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - pmtl-network

  # Optional: Certbot for SSL (uncomment when ready)
  # certbot:
  #   image: certbot/certbot
  #   container_name: pmtl-certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   command: certonly --webroot -w /var/www/certbot -d yourdomain.com -d www.yourdomain.com --email your-email@example.com --agree-tos --non-interactive
  #   networks:
  #     - pmtl-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  pmtl-network:
    driver: bridge
